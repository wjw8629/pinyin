<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- Essential viewport tags to prevent erratic zoom on input focus -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>文章阅读与输入</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Main structural wrapper */
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            display: -webkit-flex;
            flex-direction: column;
            -webkit-flex-direction: column;
        }
        /* Navigation Header */
        .header {
            width: 100%;
            height: 50px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            display: -webkit-flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            -webkit-flex-shrink: 0;
        }
        .header-title {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }
        .nav-link {
            font-size: 14px;
            color: #3498db;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid #3498db;
            border-radius: 6px;
            background: transparent;
        }
        /* Reading Section: shrinks intelligently when keyboard opens */
        .text-display-box {
            flex: 1;
            -webkit-flex: 1;
            width: 100%;
            background: #ffffff;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border-bottom: 2px dashed #cbd5e1;
            transition: all 0.15s ease-out; /* Smooth transition when resizing */
        }
        .text-content {
            font-size: 20px;
            line-height: 1.6;
            color: #2c3e50;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        /* Input container area */
        .input-box-container {
            height: 35%; /* Default distribution */
            width: 100%;
            background: #f8fafc;
            padding: 12px;
            flex-shrink: 0;
            -webkit-flex-shrink: 0;
            transition: all 0.15s ease-out;
        }
        .custom-textarea {
            width: 100%;
            height: 100%;
            padding: 12px;
            font-size: 18px;
            color: #334155;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            resize: none;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
            -webkit-appearance: none; /* Removes native mobile styling overrides */
        }
        .custom-textarea:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        /* ----------------------------------------------------
           DYNAMIC KEYBOARD CLASSES (Triggered by JavaScript)
           ---------------------------------------------------- */
        /* When keyboard is active, give the textarea container priority */
        .keyboard-active .text-display-box {
            flex: 0 1 40%; /* Let reading text compress down to 40% if needed */
            padding: 10px 20px; /* Slimmer padding to optimize space */
        }
        .keyboard-active .input-box-container {
            height: 60%; /* Give the input field the dominant remaining space */
            padding: 8px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- Top Nav Bar -->
        <div class="header">
            <span class="header-title">文章查看</span>
            <a href="zika.html" class="nav-link">切换到字卡</a>
        </div>

        <!-- Upper Content Display -->
        <div class="text-display-box">
            <div class="text-content" id="article-content">加载中...</div>
        </div>

        <!-- Lower Input Area -->
        <div class="input-box-container">
            <textarea class="custom-textarea" id="user-input" placeholder="在此输入文本进行练习或记录..."></textarea>
        </div>
    </div>

    <script>
        var articleEl = document.getElementById('article-content');
        var containerEl = document.getElementById('main-container');
        var textareaEl = document.getElementById('user-input');

        // Fetch current.txt with cache busting
        fetch('current.txt?v=' + Date.now())
            .then(function(response) {
                if (!response.ok) throw new Error('未找到 current.txt 文件');
                return response.text();
            })
            .then(function(text) {
                if (text.trim().length > 0) {
                    articleEl.textContent = text;
                } else {
                    articleEl.textContent = "文件内没有内容。";
                }
            })
            .catch(function(err) {
                articleEl.textContent = "加载错误，请检查服务器上是否存在 current.txt 文件。";
                console.error(err);
            });

        /* ========================================================
           INTELLIGENT ANDROID KEYBOARD ADAPTATION LOGIC
           ======================================================== */
        // Store the initial window height on load
        var initialHeight = window.innerHeight;

        window.addEventListener('resize', function() {
            // Android soft keyboard shrinks the window.innerHeight considerably
            var currentHeight = window.innerHeight;
            
            // If the screen height drops by more than 150px, the keyboard is open
            if (initialHeight - currentHeight > 150) {
                containerEl.classList.add('keyboard-active');
                
                // Automatically scroll the active cursor into view cleanly after resize layout finishes
                setTimeout(function() {
                    textareaEl.scrollIntoView({ block: "end", behavior: "smooth" });
                }, 50);
            } else {
                // Keyboard closed -> Restore layout split
                containerEl.classList.remove('keyboard-active');
            }
        });

        // Fail-safe focus/blur handlers if resize calculation is slightly off on older OS versions
        textareaEl.addEventListener('focus', function() {
            // Ensure layout smoothly scoots down text if window resize acts lazy
            setTimeout(function() {
                if (window.innerHeight < initialHeight) {
                    containerEl.classList.add('keyboard-active');
                }
            }, 100);
        });
    </script>
</body>
</html>
