<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>文章阅读与输入</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Page Layout Split */
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            display: -webkit-flex;
            flex-direction: column;
            -webkit-flex-direction: column;
        }
        /* Top Navigation Header */
        .header {
            width: 100%;
            height: 50px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            display: -webkit-flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            -webkit-flex-shrink: 0;
        }
        .header-title {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }
        .nav-link {
            font-size: 14px;
            color: #3498db;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid #3498db;
            border-radius: 6px;
            background: transparent;
        }
        /* Top Section: Text Display */
        .text-display-box {
            flex: 1;
            -webkit-flex: 1;
            width: 100%;
            background: #ffffff;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* Smooth scrolling for old iOS/Android */
            border-bottom: 2px dashed #cbd5e1;
        }
        .text-content {
            font-size: 20px; /* Highly legible size for reading */
            line-height: 1.6;
            color: #2c3e50;
            white-space: pre-wrap; /* Keeps line breaks from the txt file */
            word-wrap: break-word;
        }
        /* Bottom Section: Text Input Area */
        .input-box-container {
            height: 35%; /* Fixed percentage allocation */
            width: 100%;
            background: #f8fafc;
            padding: 12px;
            flex-shrink: 0;
            -webkit-flex-shrink: 0;
        }
        .custom-textarea {
            width: 100%;
            height: 100%;
            padding: 12px;
            font-size: 18px;
            color: #334155;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            resize: none; /* Disables drag resizing handles */
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        }
        .custom-textarea:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Nav Bar -->
        <div class="header">
            <span class="header-title">文章查看</span>
            <!-- Back to Index link -->
            <a href="zika.html" class="nav-link">切换到字卡</a>
        </div>

        <!-- Upper Content Display -->
        <div class="text-display-box">
            <div class="text-content" id="article-content">加载中...</div>
        </div>

        <!-- Lower Input Area -->
        <div class="input-box-container">
            <textarea class="custom-textarea" id="user-input" placeholder="在此输入文本进行练习或记录..."></textarea>
        </div>
    </div>

    <script>
        var articleEl = document.getElementById('article-content');

        // Dynamically fetch current.txt with cache busting
        fetch('current.txt?v=' + Date.now())
            .then(function(response) {
                if (!response.ok) throw new Error('未找到 current.txt 文件');
                return response.text();
            })
            .then(function(text) {
                if (text.trim().length > 0) {
                    articleEl.textContent = text;
                } else {
                    articleEl.textContent = "文件内没有内容。";
                }
            })
            .catch(function(err) {
                articleEl.textContent = "加载错误，请检查服务器上是否存在 current.txt 文件。";
                console.error(err);
            });
    </script>
</body>
</html>
