name: Validate Dictionary

on:
  workflow_dispatch:
  push:
    paths:
      - "generated/**"
      - "scripts/validate_dictionary.py"
      - "scripts/test_dictionary.py"
      - ".github/workflows/validate-dictionary.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate structure
        run: python3 scripts/validate_dictionary.py

      - name: Run pronunciation smoke tests
        run: python3 scripts/test_dictionary.py
