name: 更新

on:
  # 允许你在 GitHub 页面上手动点击运行 (Run workflow)
  workflow_dispatch:
  # 如果你希望每次修改 current.txt 并提交时自动运行，可以取消下面三行的注释：
  # push:
  #   paths:
  #     - 'current.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许自动化脚本提交代码回你的仓库

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 提取汉字、去重并更新已学记录
      run: |
        python - <<'PY'
        import os
        import unicodedata

        input_file = 'current.txt'  # 你自己粘贴的短文文件名
        output_file = 'zika.txt'

        if not os.path.exists(input_file):
            print(f"错误：在主目录下没有找到 '{input_file}' 文件，请先创建它并粘贴短文。")
            exit(1)

        with open(input_file, 'r', encoding='utf-8') as source:
            content = source.read()

        chinese_chars = []
        for character in content:
            name = unicodedata.name(character, '')
            # 兼容汉字“〇”(\u3007) 以及常规汉字、扩展汉字块
            if character == '\u3007' or name.startswith((
                'CJK UNIFIED IDEOGRAPH',
                'CJK COMPATIBILITY IDEOGRAPH',
            )):
                chinese_chars.append(character)

        # 保留首次出现顺序，并以空格分隔
        unique_chars = list(dict.fromkeys(chinese_chars))
        learned_file = 'learned.txt'
        learned_words = []
        if os.path.exists(learned_file):
          with open(learned_file, 'r', encoding='utf-8') as learned:
            lines = learned.readlines()
          if lines:
            if '已学' in lines[0]:
              learned_content = ' '.join(lines[1:])
            else:
              learned_content = ' '.join(lines)
            learned_words = learned_content.split()

        learned_chars = set(learned_words)
        new_chars = [character for character in unique_chars if character not in learned_chars]
        if new_chars:
          with open(output_file, 'w', encoding='utf-8') as result:
            result.write(' '.join(new_chars))

          learned_words.extend(new_chars)
          with open(learned_file, 'w', encoding='utf-8') as learned:
            learned.write(f'已学{len(learned_words)}字\n')
            learned.write(' '.join(learned_words))

          print(f'成功处理！新增 {len(new_chars)} 个汉字，当前已学 {len(learned_words)} 字。')
        else:
          print('提取的汉字均已学过，zika.txt 和 learned.txt 保持不变。')
        PY

    - name: 自动提交并推送到仓库
      run: |
        git config --local user.email "41898282+github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add zika.txt learned.txt
        # 只有文件发生变化时才提交，防止报错
        git diff --cached --quiet || (git commit -m "自动更新 zika.txt 汉字字卡文件" && git push)
