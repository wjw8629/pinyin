name: 自动合并单字

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请改成 master
    paths:
      - 'zika.txt'  # 只有当 zika.txt 被修改并提交时，才会触发这个自动化

jobs:
  merge-and-commit:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 运行合并脚本
      run: python merge_words.py

    - name: 提交更新后的文件
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add learned.txt zika.txt
        # 只有在文件确实有变动时才提交，防止报错
        git diff --staged --quiet || git commit -m "chore: 自动化更新 learned.txt"
        
    - name: 推送更改
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
